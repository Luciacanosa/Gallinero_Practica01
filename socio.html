<!doctype html>
<html lang="es" class="scroll-smooth cursor-none **:cursor-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto · El Gallinero · Cine de barrio</title>

    <!-- tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!-- AOS: animaciones al hacer scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- Swiper: cintas de texto en movimiento -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css"
    />

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- colores y fuentes del cine con @theme (Tailwind v4) -->
    <style type="text/tailwindcss">
      @theme {
        --color-noche: #0e0e0e;
        --color-butaca: #e63b2e;
        --color-papel: #f2efe9;
        --color-gris: #8a8780;
        --font-cartel: "Archivo", sans-serif;
        --font-mono: "Space Mono", monospace;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-noche font-cartel text-papel antialiased selection:bg-butaca selection:text-noche"
  >
    <!-- cursor personalizado: circulito rojo -->
    <div
      class="cursor-index pointer-events-none fixed top-0 left-0 z-[9999] size-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-[#6e0000] bg-[#6e0000] transition-[scale,background-color] duration-200 ease-in-out"
    ></div>

    <!-- HEADER Y NAV -->
    <header
      class="sticky top-0 z-50 border-b border-papel/15 bg-noche/90 backdrop-blur"
    >
      <nav
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 md:px-10"
      >
        <a
          href="index.html"
          class="text-xl font-black tracking-tight uppercase md:text-2xl"
        >
          El Gallinero<span class="text-butaca">.</span>
        </a>

        <!-- botón menú móvil (jQuery) -->
        <button
          id="btn-menu"
          class="font-mono text-xs uppercase tracking-widest md:hidden"
          aria-label="Abrir menú"
        >
          Menú +
        </button>

        <ul
          class="hidden gap-8 font-mono text-xs uppercase tracking-widest md:flex"
        >
          <li>
            <a href="index.html" class="transition-colors hover:text-butaca"
              >Inicio</a
            >
          </li>
          <li>
            <a href="cartelera.html" class="transition-colors hover:text-butaca"
              >Cartelera</a
            >
          </li>
          <li>
            <a href="ciclos.html" class="transition-colors hover:text-butaca"
              >Ciclos</a
            >
          </li>
          <li>
            <a href="contacto.html" class="text-butaca" aria-current="page"
              >Contacto</a
            >
          </li>
        </ul>
      </nav>

      <!-- menú desplegable móvil -->
      <ul
        id="menu-movil"
        class="hidden border-t border-papel/15 px-5 py-6 font-mono text-sm uppercase tracking-widest md:hidden"
      >
        <li class="py-2"><a href="index.html">Inicio</a></li>
        <li class="py-2"><a href="cartelera.html">Cartelera</a></li>
        <li class="py-2"><a href="ciclos.html">Ciclos</a></li>
        <li class="py-2 text-butaca"><a href="contacto.html">Contacto</a></li>
      </ul>
    </header>
  </body>
</html>
