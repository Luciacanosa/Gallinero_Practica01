<!doctype html>

<html lang="es" class="scroll-smooth cursor-none **:cursor-none">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto · El Gallinero · Cine de barrio</title>

    <!-- tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!-- AOS: animaciones al hacer scroll -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- Swiper: cintas de texto en movimiento -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css"
    />

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- colores y fuentes del cine con @theme (Tailwind v4) -->
    <style type="text/tailwindcss">
      @theme {
        --color-noche: #0e0e0e;
        --color-butaca: #e63b2e;
        --color-papel: #f2efe9;
        --color-gris: #8a8780;
        --font-cartel: "Archivo", sans-serif;
        --font-mono: "Space Mono", monospace;
      }
    </style>
  </head>

  <body
    class="min-h-screen bg-noche font-cartel text-papel antialiased selection:bg-butaca selection:text-noche"
  >
    <!-- cursor personalizado: circulito rojo -->
    <div
      class="cursor-index pointer-events-none fixed top-0 left-0 z-[9999] size-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-[#6e0000] bg-[#6e0000] transition-[scale,background-color] duration-200 ease-in-out"
    ></div>

    <!-- HEADER Y NAV -->
    <header
      class="sticky top-0 z-50 border-b border-papel/15 bg-noche/90 backdrop-blur"
    >
      <nav
        class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 md:px-10"
      >
        <a
          href="index.html"
          class="text-xl font-black tracking-tight uppercase md:text-2xl"
        >
          El Gallinero<span class="text-butaca">.</span>
        </a>

        <!-- botón menú móvil (jQuery) -->
        <button
          id="btn-menu"
          class="font-mono text-xs uppercase tracking-widest md:hidden"
          aria-label="Abrir menú"
        >
          Menú +
        </button>

        <ul
          class="hidden gap-8 font-mono text-xs uppercase tracking-widest md:flex"
        >
          <li>
            <a href="index.html" class="transition-colors hover:text-butaca"
              >Inicio</a
            >
          </li>
          <li>
            <a href="cartelera.html" class="transition-colors hover:text-butaca"
              >Cartelera</a
            >
          </li>
          <li>
            <a href="ciclos.html" class="transition-colors hover:text-butaca"
              >Ciclos</a
            >
          </li>
          <li>
            <a href="contacto.html" class="text-butaca" aria-current="page"
              >Contacto</a
            >
          </li>
        </ul>
      </nav>

      <!-- menú desplegable móvil -->
      <ul
        id="menu-movil"
        class="hidden border-t border-papel/15 px-5 py-6 font-mono text-sm uppercase tracking-widest md:hidden"
      >
        <li class="py-2"><a href="index.html">Inicio</a></li>
        <li class="py-2"><a href="cartelera.html">Cartelera</a></li>
        <li class="py-2"><a href="ciclos.html">Ciclos</a></li>
        <li class="py-2 text-butaca"><a href="contacto.html">Contacto</a></li>
      </ul>
    </header>
  </body>
</html>

<html lang="es" class="scroll-smooth cursor-none **:cursor-none">
  <!doctype html>

  <html lang="es" class="dark">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>El Gallinero · Cine de barrio en Lavapiés</title>
      <meta
        name="description"
        content="El Gallinero, cine de barrio en Lavapiés: cartelera en versión original, cineclub, matinales y alquiler de sala."
      />

      <!-- tipografías -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
      />

      <!-- Font Awesome: iconos del menú hamburguesa -->
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      />

      <!-- jQuery -->
      <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

      <!-- AOS -->
      <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

      <!-- Swiper -->
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.css"
      />

      <!-- Tailwind CSS v4 CDN -->
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

      <!-- sistema de diseño con @theme + modo oscuro con la clase .dark -->
      <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
        @theme {
          --color-noche: #0e0e0e;
          --color-butaca: #e63b2e;
          --color-papel: #f2efe9;
          --color-gris: #8a8780;
          --font-cartel: "Archivo", sans-serif;
          --font-mono: "Space Mono", monospace;
        }
      </style>

      <!-- hoja de estilos propia: solo lo que Tailwind no resuelve (animaciones y forma de entrada) -->
      <link rel="stylesheet" href="css/style.css" />
    </head>
  </html>
</html>

<boby>
  <!-- para que el cursor del ratón sea un circulito -->
  <div
    class="cursor-index pointer-events-none fixed top-0 left-0 z-[9999] size-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-butaca bg-butaca transition-[scale,background-color] duration-200 ease-in-out"
  ></div>

  <!-- Menú de navegación - nav bar cogido de ejercicios de clase -->
  <header
    class="navbar sticky top-0 z-50 flex items-center justify-between gap-4 border-b border-noche/15 bg-papel/90 px-5 py-3 backdrop-blur md:px-10 dark:border-papel/15 dark:bg-noche/90"
  >
    <div class="logo">
      <a href="index.html" class="group flex items-center gap-3">
        <img
          src="img/gallinero logo.png"
          alt="Logo de El Gallinero"
          width="800"
          height="737"
          class="h-10 w-auto transition-transform duration-300 group-hover:-rotate-6 group-focus-visible:-rotate-6 md:h-12 dark:brightness-[1.7]"
        />
        <span
          class="text-lg leading-none font-black tracking-tight uppercase md:text-xl"
          >El Gallinero<span class="text-butaca">.</span></span
        >
      </a>
    </div>
    <!-- Icono hamburguesa -->
    <div class="burger md:hidden">
      <i
        class="fas fa-bars p-2 text-2xl text-noche transition-colors hover:text-butaca focus-visible:text-butaca dark:text-papel"
        role="button"
        tabindex="0"
        aria-label="Abrir o cerrar el menú"
      ></i>
    </div>

    <!-- Menú de navegación -->
    <nav
      class="nav-links menu absolute inset-x-0 top-full hidden flex-col items-start border-b border-noche/15 bg-papel px-5 py-4 font-mono text-sm uppercase tracking-widest md:static md:flex md:flex-row md:items-center md:gap-8 md:border-0 md:bg-transparent md:p-0 md:text-xs dark:border-papel/15 dark:bg-noche md:dark:bg-transparent [&.menu-show]:flex"
      aria-label="Principal"
    >
      <a
        href="index.html"
        class="py-3 underline decoration-transparent decoration-2 underline-offset-4 transition hover:text-butaca hover:decoration-current focus-visible:decoration-current md:py-0"
        >Inicio</a
      >
      <a
        href="cartelera.html"
        class="py-3 underline decoration-transparent decoration-2 underline-offset-4 transition hover:text-butaca hover:decoration-current focus-visible:decoration-current md:py-0"
        >Cartelera</a
      >
      <a
        href="socio.html"
        class="py-3 underline decoration-transparent decoration-2 underline-offset-4 transition hover:text-butaca hover:decoration-current focus-visible:decoration-current md:py-0"
        >Hazte socio</a
      >
      <a
        href="contacto.html"
        class="py-3 underline decoration-transparent decoration-2 underline-offset-4 transition hover:text-butaca hover:decoration-current focus-visible:decoration-current md:py-0"
        >Contacto</a
      >
      <!-- botón para el modo claro oscuro -->
      <button
        id="btn-tema"
        class="mt-2 whitespace-nowrap border border-noche/30 px-3 py-2 font-mono text-xs uppercase tracking-widest transition-colors hover:border-butaca hover:text-butaca md:mt-0 dark:border-papel/30"
        aria-label="Cambiar modo claro u oscuro"
      >
        <span class="dark:hidden">Oscuro</span>
        <span class="hidden dark:inline">Claro</span>
      </button>
    </nav>
  </header>

  <!-- Scripts -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11.1.14/swiper-bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>
  <script src="js/script.js"></script>
</boby>
