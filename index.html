<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><Cine El Gallinero></title>

    <!-- tipografías importadas de Adobe -->
    <link rel="stylesheet" href="https://use.typekit.net/kie0hig.css" />

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Estilos con @theme según directrices Tailwind v4 -->
    <style type="text/tailwindcss">
      @theme {
        --color-celuloide: #f1ebdd;
        --color-proyector: #17120f;
        --color-gallo: #8a2b25;
        --color-platea: #3f5130;

        /* Nombres exactos para las fuentes de Adobe en vuestro sistema */
        --font-titulo: "pacaembu", sans-serif;
        --font-texto: "bulletin-typewriter", monospace;
      }
    </style>
  </head>

  <!-- cursor-none + **:cursor-none: oculta el cursor del sistema en toda la página, también en enlaces y botones -->
  <body class="cursor-none **:cursor-none">
    <!-- cursor personalizado: circulito rojo -->
    <div
      class="cursor-index pointer-events-none fixed top-0 left-0 z-[9999] size-5 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-[#6e0000] bg-[#6e0000] transition-[scale,background-color] duration-200 ease-in-out"
    ></div>

    <!-- HEADER Y NAV -->
    <header class=""></header>

    <main></main>

    <!-- FOOTER -->
    <footer class=""></footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
